<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Nagata's Soundboard</title>

    <!-- ==========================================================
         AJUSTE DE RESPONSIVIDADE (1/4)
         Meta viewport: obrigatória para que o navegador mobile
         renderize a página na largura real do dispositivo, e não
         numa largura "desktop" reduzida depois por zoom.
         ========================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/soundbo.css" type="text/css">

    <!-- ==========================================================
         AJUSTE DE RESPONSIVIDADE (2/4)
         Inserção do Bootstrap 5 (via CDN, somente o CSS) para usar
         as classes utilitárias de flexbox/grid responsivas
         (d-flex, flex-wrap, container-fluid, gap-*, justify-content-*)
         nos blocos de ícones/iframes e na barra de abas.
         O CSS original (css/soundbo.css) continua sendo carregado
         DEPOIS do Bootstrap, então qualquer estilo próprio do
         soundboard tem prioridade e sobrescreve o Bootstrap quando
         necessário.
         ========================================================== -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >

    <script src="js/soundbo.js" defer></script>

    <!-- ==========================================================
         AJUSTE DE RESPONSIVIDADE (3/4)
         Bloco de CSS complementar (não é Bootstrap) para garantir que
         os iframes de 110x200 nunca estourem a largura da tela em
         telas médias/grandes e que a barra de abas role
         horizontalmente nesses tamanhos, em vez de quebrar o layout.
         Esse comportamento vale para tablets/desktop; em smartphones
         (ver bloco 4/4 abaixo) o layout muda para grid de 3 colunas.
         ========================================================== -->
    <style>
      html, body {
        overflow-x: hidden;
        max-width: 100%;
      }

      /* Os iframes mantêm o tamanho original (110x200) em telas
         médias/grandes, mas encolhem proporcionalmente conforme a
         tela estreita, sem cortar conteúdo. */
      .tab-panel iframe {
        width: 110px;
        max-width: 28vw;
        height: 200px;
        max-height: 45vw;
      }

      /* Permite rolagem horizontal suave da barra de abas em telas
         médias/estreitas (tablets), em vez de quebrar/espremer os
         botões. Em smartphones esse comportamento é substituído
         pelo grid de 3 colunas definido no bloco 4/4. */
      .nav-tabs.flex-nowrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .nav-tabs .tab-btn {
        flex: 0 0 auto;
      }

      /* ==========================================================
         AJUSTE DE RESPONSIVIDADE (4/4)
         SMARTPHONES (largura <= 767.98px, breakpoint "md" do
         Bootstrap): tanto os itens embedados (iframes) quanto o
         menu de navegação passam a usar CSS Grid com EXATAMENTE
         3 colunas, em vez do flex-wrap "quantas couberem" usado em
         telas maiores. O !important é necessário porque as classes
         utilitárias do Bootstrap (.d-flex) também usam !important,
         então precisamos da mesma prioridade para sobrescrevê-las
         apenas nesta faixa de tela.
         ========================================================== */
      @media (max-width: 767.98px) {

        /* --- Menu de navegação em grid de 3 colunas --- */
        .navbar {
          flex-direction: column;
          align-items: stretch;
          gap: 0.75rem;
          padding: 0.75rem 1rem;
        }

        .nav-logo {
          text-align: center;
        }

        .nav-tabs.flex-nowrap {
          display: grid !important;
          grid-template-columns: repeat(3, 1fr);
          gap: 0.4rem 0.25rem;
          overflow-x: visible;
          white-space: normal;
        }

        .nav-tabs .tab-btn {
          flex: unset;
          width: 100%;
          text-align: center;
          padding: 0.45rem 0.25rem;
          font-size: 0.72rem;
          line-height: 1.15;
          white-space: normal;
          word-break: break-word;
        }

        /* O indicador deslizante foi pensado para uma barra de abas
           em linha única; em um grid de 3 colunas com múltiplas
           linhas ele não faz mais sentido visualmente, então fica
           oculto nesta faixa de tela. */
        .tab-indicator {
          display: none;
        }

        /* --- Itens embedados (iframes) em grid de 3 colunas --- */
        .tab-panel {
          padding: 1rem 0.5rem;
        }

        .tab-panel .container-fluid {
          display: grid !important;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          justify-items: center;
        }

        .tab-panel iframe {
          width: 100%;
          max-width: 100%;
          height: auto;
          aspect-ratio: 110 / 200;
          max-height: none;
        }
      }
    </style>
  </head>
